# ==============================================================================
# ARC Investment Platform - Docker Compose (Integration Tests)
# ==============================================================================
# Usage:
#   docker-compose -f docker-compose.test.yml up -d    # Start test services
#   docker-compose -f docker-compose.test.yml down -v  # Clean up after tests
#
# These services run on different ports to avoid conflicts with development:
#   - PostgreSQL: 5433 (instead of 5432)
#   - Redis: 6380 (instead of 6379)
# ==============================================================================
name: arc
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database for Testing (pgvector)
  # ---------------------------------------------------------------------------
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: arc_postgres_test
    environment:
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc_test
      POSTGRES_PASSWORD: arc_test_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc_test -d arc_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - arc_test
    # No restart policy for test containers - use tmpfs for ephemeral data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Redis Cache for Testing
  # ---------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: arc_redis_test
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - arc_test
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

# ==============================================================================
# Volumes (Optional - using tmpfs in test mode for speed)
# ==============================================================================
volumes:
  postgres_test_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  arc_test:
    driver: bridge
