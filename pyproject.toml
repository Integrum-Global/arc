[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc"
version = "0.1.0"
description = "Alpha Risk Capital Investment Management"
authors = [
    {name = "Integrum", email = "info@integrum.com"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Kailash SDK
    "kailash>=0.10.13",
    "kailash-nexus>=1.1.2",
    "kailash-dataflow>=0.10.12",
    "kailash-kaizen>=0.8.2",
    # Web Framework
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    # CLI Framework
    "click>=8.0",
    "rich>=13.0.0",
    # Data Handling
    "pydantic>=2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.12.0",
    # Development Tools
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    # Utilities
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "torch>=2.7.1",
    "motor>=3.7.1",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "mypy>=0.9",
]

[project.urls]
"Homepage" = "https://github.com/integrum/arc"
"Bug Tracker" = "https://github.com/integrum/arc/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arc*"]
exclude = ["tests*", ".*", "__pycache__*"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "doc8>=1.1.2",
    "pre-commit>=4.2.0",
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["arc"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "kailash.*",
    "dataflow.*",
    "nexus.*",
    "kaizen.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database/services)",
    "e2e: End-to-end tests (full stack)",
]
